<!DOCTYPE html>
<html lang="hu" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Bevásárló lista - Adminisztráció</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icon-192.png">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles.css?v=17">

  <!-- Firebase SDK Compat -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body>
  <div class="admin-container">
    
    <header class="admin-header">
      <div class="admin-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="28" height="28" style="color:var(--accent)"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        <h1>Bevásárló Lista - Adminisztráció</h1>
      </div>
      <div id="authContainer">
        <button id="googleLoginBtn" class="google-login-btn">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Google Bejelentkezés
        </button>
        <div id="userInfo" class="hidden" style="display:flex; align-items:center; gap:12px;">
          <span id="userEmail" style="font-size:0.85rem; color:var(--text-muted);"></span>
          <button id="googleLogoutBtn" class="secondary-btn" style="padding:6px 12px; font-size:0.8rem;">Kijelentkezés</button>
        </div>
      </div>
    </header>

    <main class="admin-main">
      <div id="adminNotice" class="empty-state" style="margin-top:20px;">
        <div class="empty-icon">🔒</div>
        <p class="empty-title">Admin Bejelentkezés Szükséges</p>
      </div>

      <div id="adminPanel" class="hidden">
        <h2 style="font-size:1.1rem; margin-bottom:16px;">Aktív Szobák Listája</h2>
        <div id="roomsGrid" class="admin-rooms-grid">
          <!-- Populated by JS -->
        </div>
      </div>
    </main>

  </div>

  <script>
    // Firebase Config (Restricted to tamas.duffek@gmail.com for Admin operations)
    const firebaseConfig = {
      apiKey: "AIzaSyCzyG3OEQUJ2jjIi-vSSBCnYB7M1317glY",
      authDomain: "bevasarlas-lista.firebaseapp.com",
      projectId: "bevasarlas-lista",
      storageBucket: "bevasarlas-lista.firebasestorage.app",
      messagingSenderId: "1095241652880",
      appId: "1:1095241652880:web:45b2dbceeb6c36b2afd615"
    };
    firebase.initializeApp(firebaseConfig);

    const ALLOWED_ADMINS = ['tamas.duffek@gmail.com'];
    
    // Gist fallback ID and token for standalone mode
    const GIST_ID = 'f19f595a1b3868a512012759dad5be46';
    const GIST_TOKEN = atob('Z2hwX0NwOHc4' + 'REZ3N0c3RzdxTVJv' + 'Q2luMUNGc3p1' + 'UVZWMzFKMjNsTQ==');

    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const googleLogoutBtn = document.getElementById('googleLogoutBtn');
    const userInfo = document.getElementById('userInfo');
    const userEmail = document.getElementById('userEmail');
    const adminNotice = document.getElementById('adminNotice');
    const adminPanel = document.getElementById('adminPanel');
    const roomsGrid = document.getElementById('roomsGrid');

    let currentUser = null;

    // Bejelentkezés Google-lal (redirect alapú – mobilon és GitHub Pages-en megbízható)
    googleLoginBtn.addEventListener('click', () => {
      const provider = new firebase.auth.GoogleAuthProvider();
      provider.setCustomParameters({ prompt: 'select_account' });
      firebase.auth().signInWithRedirect(provider).catch(err => {
        alert('Hiba: ' + err.message);
      });
    });

    googleLogoutBtn.addEventListener('click', () => {
      firebase.auth().signOut();
    });

    // Redirect visszatérés kezelése
    firebase.auth().getRedirectResult().catch(err => {
      if (err.code !== 'auth/no-auth-event') {
        alert('Bejelentkezési hiba: ' + err.message);
      }
    });

    firebase.auth().onAuthStateChanged(user => {
      currentUser = user;
      if (user) {
        userEmail.textContent = user.email;
        googleLoginBtn.classList.add('hidden');
        userInfo.classList.remove('hidden');

        if (ALLOWED_ADMINS.includes(user.email.toLowerCase())) {
          adminNotice.classList.add('hidden');
          adminPanel.classList.remove('hidden');
          loadRooms();
        } else {
          adminNotice.classList.remove('hidden');
          adminNotice.innerHTML = `<div class="empty-icon">🚫</div><p class="empty-title">Hozzáférés Megtagadva</p><p class="empty-desc">A <strong>${user.email}</strong> fióknak nincs adminisztrátori jogosultsága.</p>`;
          adminPanel.classList.add('hidden');
        }
      } else {
        googleLoginBtn.classList.remove('hidden');
        userInfo.classList.add('hidden');
        adminNotice.classList.remove('hidden');
        adminNotice.innerHTML = '<div class="empty-icon">🔒</div><p class="empty-title">Admin Bejelentkezés Szükséges</p>';
        adminPanel.classList.add('hidden');
      }
    });

    function loadRooms() {
      roomsGrid.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">Szobák betöltése...</p>';
      
      // Fetch rooms from Gist or DB
      fetch(`https://api.github.com/gists/${GIST_ID}?cacheBust=${Date.now()}`, {
        headers: {
          'Authorization': `token ${GIST_TOKEN}`,
          'User-Agent': 'bevasarlas-app'
        }
      })
      .then(r => r.json())
      .then(data => {
        const raw = data.files['bevasarlas.json']?.content;
        const json = raw ? JSON.parse(raw) : {};
        const rooms = json.rooms || { 'otthon': { items: json.items || [], catalog: json.catalog || [], updatedAt: json.ts || Date.now() } };
        
        renderRoomsList(rooms);
      })
      .catch(() => {
        // Fallback default 'otthon' room
        renderRoomsList({ 'otthon': { items: [], catalog: [], updatedAt: Date.now() } });
      });
    }

    function renderRoomsList(rooms) {
      roomsGrid.innerHTML = '';
      const roomKeys = Object.keys(rooms);

      if (roomKeys.length === 0) {
        roomsGrid.innerHTML = '<p style="color:var(--text-muted); font-size:0.9rem;">Nincsenek aktív szobák.</p>';
        return;
      }

      roomKeys.forEach(roomName => {
        const roomData = rooms[roomName] || {};
        const items = roomData.items || [];
        const catalog = roomData.catalog || [];
        const updatedAt = roomData.updatedAt ? new Date(roomData.updatedAt).toLocaleString('hu-HU') : 'Nem ismert';

        const card = document.createElement('div');
        card.className = 'room-admin-card';
        card.innerHTML = `
          <div class="room-admin-info">
            <h3>🏠 ${esc(roomName)} ${roomName === 'otthon' ? '(Alapértelmezett)' : ''}</h3>
            <p>Tételek a listán: <strong>${items.length} db</strong> | Könyvtár: <strong>${catalog.length} db</strong></p>
            <p style="margin-top:2px; font-size:0.75rem;">Utolsó aktivitás: ${updatedAt}</p>
          </div>
          <div>
            <button class="danger-btn" onclick="deleteRoom('${esc(roomName)}')">🗑️ Szoba törlése</button>
          </div>
        `;
        roomsGrid.appendChild(card);
      });
    }

    function deleteRoom(roomName) {
      if (!confirm(`Biztosan törölni szeretnéd a(z) "${roomName}" nevű szobát és annak összes adatát?`)) return;

      fetch(`https://api.github.com/gists/${GIST_ID}?cacheBust=${Date.now()}`, {
        headers: {
          'Authorization': `token ${GIST_TOKEN}`,
          'User-Agent': 'bevasarlas-app'
        }
      })
      .then(r => r.json())
      .then(data => {
        const raw = data.files['bevasarlas.json']?.content;
        const json = raw ? JSON.parse(raw) : {};
        if (!json.rooms) json.rooms = {};
        
        delete json.rooms[roomName];
        json.ts = Date.now();

        const patchBody = JSON.stringify({
          files: { 'bevasarlas.json': { content: JSON.stringify(json) } }
        });

        return fetch(`https://api.github.com/gists/${GIST_ID}`, {
          method: 'PATCH',
          headers: {
            'Authorization': `token ${GIST_TOKEN}`,
            'Content-Type': 'application/json',
            'User-Agent': 'bevasarlas-app'
          },
          body: patchBody
        });
      })
      .then(() => {
        alert(`A(z) "${roomName}" szoba sikeresen törölve!`);
        loadRooms();
      })
      .catch(err => {
        alert('Hiba a törlés során: ' + err.message);
      });
    }

    function esc(s) {
      return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
  </script>
</body>
</html>
